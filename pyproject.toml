[project]
name = "xkcdkit"
version = "0.4.0"
description = "xkcd comics as a Python library, a CLI and a TUI, with a local cache and explainxkcd explanations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Eivind Teig", email = "eivind@dchub.no" }]
requires-python = ">=3.12"
keywords = ["xkcd", "comics", "cli", "tui", "textual"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Terminals",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2.16",
  "pydantic>=2.11",
  "typer>=0.17",
  "textual>=6.0",
  "textual-image>=0.14",
  "rapidfuzz>=3.13",
  "platformdirs>=4.3",
]

[project.urls]
Homepage = "https://github.com/eivl/xkcdkit"
Repository = "https://github.com/eivl/xkcdkit"
Changelog = "https://github.com/eivl/xkcdkit/blob/main/CHANGELOG.md"

[project.scripts]
xkcd = "xkcdkit.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.2",
  "coverage[toml]>=7.10",
  "ruff>=0.14",
  "mypy>=1.18",
  "flake8>=7.3",
  "tox>=4.30",
  "tox-uv>=1.28",
  "pre-commit>=4.3",
  "zizmor>=1.20",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "N", "SIM", "RUF", "ASYNC", "PT", "S"]
ignore = ["D203", "D213", "S101", "S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["textual_image.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["xkcdkit"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
build_command = "pip install uv && uv lock"
assets = ["uv.lock"]
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.changelog]
mode = "update"
default_templates = { changelog_file = "CHANGELOG.md" }

[tool.semantic_release.branches.main]
match = "main"
